# KnowAct — local development services
#
# Usage:
#   docker compose up -d
#   cd backend && .venv\Scripts\alembic upgrade head && .venv\Scripts\python -m app.seed
#
# The image ships the pgvector extension, which the document-retrieval index
# requires. Host port 5434 is used so this container can run alongside any other
# PostgreSQL already listening on 5432/5433.

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: knowact-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5434:5432"
    environment:
      POSTGRES_USER: knowact_app
      # Local-only credential: the container is published on localhost and holds
      # nothing but development data. Deployed databases use DATABASE_URL instead.
      POSTGRES_PASSWORD: "123"
      POSTGRES_DB: knowact
    volumes:
      - knowact_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowact_app -d knowact"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  knowact_pgdata:
